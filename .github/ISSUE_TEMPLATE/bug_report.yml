name: Bug report
description: Report a reproducible RepoTend defect
title: 'bug: '
body:
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
      placeholder: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe example that reproduces this problem.
      placeholder: |
        1. Create ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. main at abc123
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Relevant runtime, logs (without secrets), or screenshots.
